apiVersion: apps/v1
kind: Deployment
metadata:
  name: progress-service
  namespace: physics

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: progress-service

  template:
    metadata:
      labels:
        app: progress-service

    spec:
      containers:
        - name: progress-service
          image: physics-progress:v2
          imagePullPolicy: Never

          ports:
            - containerPort: 3004

          env:
            - name: PORT
              value: "3004"

            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: physics-config
                  key: NODE_ENV

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: physics-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: physics-config
                  key: DB_PORT

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: physics-secrets
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: physics-secrets
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: physics-secrets
                  key: POSTGRES_DB

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"

          startupProbe:
            httpGet:
              path: /health
              port: 3004
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3

          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL
