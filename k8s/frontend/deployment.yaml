apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: physics

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: ahmedrabie222000/physics-frontend:v17
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"

            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: physics-config
                  key: NODE_ENV

            - name: GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: physics-config
                  key: GATEWAY_URL

            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: physics-secrets
                  key: SESSION_SECRET

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"

          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3

          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL
