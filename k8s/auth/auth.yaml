apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: physics
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-service
  namespace: physics
spec:
  serviceName: auth-service

  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      securityContext:
        fsGroup: 101
      
      initContainers:
        - name: fix-permissions
          image: ahmedrabie222000/physics-auth-service:v10
          imagePullPolicy: Always

          command:
            - sh
            - -c
            - |
              chown -R 100:101 /app/data
              chmod -R u+rwX,g+rwX /app/data

          securityContext:
            runAsUser: 0

          volumeMounts:
            - name: auth-data
              mountPath: /app/data
      containers:
        - name: auth-service
          image: ahmedrabie222000/physics-auth-service:v10
          imagePullPolicy: Always

          ports:
            - containerPort: 3001

          env:
            - name: PORT
              value: "3001"

            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: physics-config
                  key: NODE_ENV

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: physics-secrets
                  key: JWT_SECRET

          volumeMounts:
            - name: auth-data
              mountPath: /app/data

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          startupProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

  volumeClaimTemplates:
    - metadata:
        name: auth-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
