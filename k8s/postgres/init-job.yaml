apiVersion: batch/v1
kind: Job

metadata:
  name: postgres-init-schema
  namespace: physics

spec:
  backoffLimit: 5

  template:
    metadata:
      labels:
        app: postgres-init-schema

    spec:
      restartPolicy: OnFailure

      containers:
        - name: postgres-init-schema
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent

          command:
            - sh
            - -c
            - |
              set -e

              echo "Waiting for PostgreSQL..."

              until PGPASSWORD="$POSTGRES_PASSWORD" pg_isready \
                -h "$DB_HOST" \
                -p "$DB_PORT" \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB"; do
                sleep 2
              done

              echo "PostgreSQL is ready"

              PGPASSWORD="$POSTGRES_PASSWORD" psql \
                -h "$DB_HOST" \
                -p "$DB_PORT" \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" \
                -v ON_ERROR_STOP=1 \
                -f /schema/schema.sql

              echo "Database schema initialized successfully"

          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: physics-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: physics-config
                  key: DB_PORT

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: physics-secrets
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: physics-secrets
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: physics-secrets
                  key: POSTGRES_DB

          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true

      volumes:
        - name: schema
          configMap:
            name: postgres-schema
